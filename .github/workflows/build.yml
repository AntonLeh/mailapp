name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Plattform-Dateien erzeugen (Android)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms android

      - name: Internet-Berechtigung und minSdk setzen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET" />|' $MANIFEST
          sed -i -E 's/minSdk(Version)? *(=|) *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: API-Signaturen von enough_mail ausgeben (Diagnose)
        continue-on-error: true
        run: |
          D=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/enough_mail-* | head -1)
          echo "== $D"
          grep -rn -E "Future<[^(]*> +(fetch[A-Za-z]*|select[A-Za-z]*|login|connectToServer|authenticate|sendMessage|quit|logout|startTls|ehlo)\(" "$D/lib/src/imap/imap_client.dart" "$D/lib/src/smtp/smtp_client.dart" | cut -c1-220
          echo "== fetch signatures"
          for f in fetchMessage fetchMessages fetchRecentMessages fetchMessagesByCriteria; do grep -n -A7 "Future<FetchImapResult> $f(" "$D/lib/src/imap/imap_client.dart"; done | cut -c1-200
          echo "== Mime API"
          grep -rn -E "decodeContentBinary\(|class MimeMessage|class MimePart|getPart\(|sequenceId|List<MimePart> get parts|MimePart> get|findContentInfo\(" "$D/lib/src" | cut -c1-200 | head -40
          echo "== fetchRecentMessages"
          sed -n '1826,1840p' "$D/lib/src/imap/imap_client.dart" | cut -c1-200
          echo "== pdfrx API"
          P=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/pdfrx-* | head -1); echo "$P"; grep -rn -E "static .*pdfrxFlutterInitialize|factory PdfViewer|static .*data\(" "$P/lib" | cut -c1-200 | head -10

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Plattform-Dateien erzeugen (Windows)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms windows

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Als ZIP verpacken
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mailapp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-windows
          path: mailapp-windows.zip
