name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Android)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms android

      - name: Internet-Berechtigung und minSdk setzen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET" />|' $MANIFEST
          sed -i -E 's/minSdk(Version)? *(=|) *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
          sed -i -E 's/compileSdk *=.*/compileSdk = 36/' android/app/build.gradle* || true
          grep -n -E 'compileSdk|minSdk' android/app/build.gradle* || true

      - run: flutter pub get

      - name: App-Icons erzeugen
        run: dart run flutter_launcher_icons

      - name: API-Diagnose addBinary
        continue-on-error: true
        run: |
          D=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/enough_mail-* | head -1)
          grep -n -A8 -E "(void|MessageBuilder|Future<[^>]*>|[A-Za-z]+) +addBinary\(" "$D/lib/src/message_builder.dart" | cut -c1-180 | head -30
          grep -n -A6 -E "addFile\(|addAttachment\(|static MessageBuilder prepareMultipart" "$D/lib/src/message_builder.dart" | cut -c1-180 | head -30

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Windows)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms windows

      - run: flutter pub get

      - name: App-Icons erzeugen
        run: dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml

      - run: flutter build windows --release

      - name: Als ZIP verpacken
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mailapp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-windows
          path: mailapp-windows.zip
