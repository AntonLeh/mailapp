name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Android)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms android

      - name: Manifest und Gradle anpassen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for perm in INTERNET POST_NOTIFICATIONS; do
            grep -q "android.permission.$perm" $MANIFEST || \
              sed -i "s|<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">|&\n    <uses-permission android:name=\"android.permission.$perm\" />|" $MANIFEST
          done
          sed -i -E 's/minSdk(Version)? *(=|) *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
          sed -i -E 's/compileSdk *=.*/compileSdk = 36/' android/app/build.gradle* || true
          python3 - <<'PY'
          import glob, re
          p = glob.glob('android/app/build.gradle*')[0]
          s = open(p, encoding='utf-8').read()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(p, 'w', encoding='utf-8').write(s)
          s = open(p, encoding='utf-8').read()
          if 'checkReleaseBuilds' not in s:
              # Lint-Analyse stürzt im Runner ab (Fehler im Lint-Werkzeug); für den Build nicht nötig.
              s = re.sub(r'(android\s*\{)', r'\1\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }', s, count=1)
              open(p, 'w', encoding='utf-8').write(s)
          print('gradle patched:', p)
          PY
          grep -n -E 'compileSdk|minSdk|Desugaring' android/app/build.gradle* || true

      - run: flutter pub get

      - name: App-Icons erzeugen
        run: dart run flutter_launcher_icons

      - name: Festen Signierschlüssel einrichten
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            echo "Fester Signierschlüssel eingerichtet"
          else
            echo "Kein Signierschlüssel hinterlegt, Debug-Signatur wird verwendet"
          fi
          python3 - <<'PY'
          import glob
          p = glob.glob('android/app/build.gradle*')[0]
          s = open(p, encoding='utf-8').read()
          if 'upload-keystore.jks' not in s:
              signing = '''
          signingConfigs {
              create("release") {
                  if (file("upload-keystore.jks").exists()) {
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("KS_STORE_PASS")
                      keyAlias = System.getenv("KS_ALIAS")
                      keyPassword = System.getenv("KS_KEY_PASS")
                  }
              }
          }
          '''
              s = s.replace('android {', 'android {' + signing, 1)
              s = s.replace(
                  'signingConfigs.getByName("debug")',
                  'signingConfigs.getByName(if (file("upload-keystore.jks").exists()) "release" else "debug")',
              )
              open(p, 'w', encoding='utf-8').write(s)
          print('Signierung in', p, 'eingetragen')
          PY

      - name: APK bauen
        env:
          KS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Windows)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms windows

      - run: flutter pub get

      - name: App-Icons erzeugen
        run: dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml

      - run: flutter build windows --release

      - name: Als ZIP verpacken
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mailapp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-windows
          path: mailapp-windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (macOS)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms macos

      - name: Netzwerk- und Dateirechte für Release setzen
        run: |
          python3 - <<'PY'
          import re
          for p in ['macos/Runner/Release.entitlements', 'macos/Runner/DebugProfile.entitlements']:
              s = open(p, encoding='utf-8').read()
              extra = ''
              for key in ['com.apple.security.network.client', 'com.apple.security.files.user-selected.read-write']:
                  if key not in s:
                      extra += f'\t<key>{key}</key>\n\t<true/>\n'
              s = s.replace('</dict>', extra + '</dict>')
              open(p, 'w', encoding='utf-8').write(s)
              print('entitlements patched:', p)
          PY

      - run: flutter pub get

      - run: flutter build macos --release

      - name: Als ZIP verpacken
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/mailapp.app mailapp-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-macos
          path: mailapp-macos.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Linux)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms linux

      - run: flutter pub get

      - name: Linux-Release bauen
        env:
          # flutter_secure_storage bringt eine ältere json.hpp mit, die mit clang -Werror scheitert.
          CXXFLAGS: -Wno-deprecated-literal-operator
        run: flutter build linux --release

      - name: Als Archiv verpacken
        run: tar -czf mailapp-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-linux
          path: mailapp-linux.tar.gz
