name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Android)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms android

      - name: Internet-Berechtigung und minSdk setzen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET" />|' $MANIFEST
          sed -i -E 's/minSdk(Version)? *(=|) *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: API-Diagnose (Anhänge, Flags, file_picker)
        continue-on-error: true
        run: |
          D=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/enough_mail-* | head -1)
          F=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/file_picker-* | head -1)
          echo "== MessageBuilder attach"
          grep -rn -E "addBinary\(|addFile\(|addAttachment\(|static MediaType guessFromFileName|guessFromFileName\(" "$D/lib/src/mail/message_builder.dart" "$D/lib/src/media_type.dart" "$D/lib/src/mail/mail_client.dart" 2>/dev/null | cut -c1-200 | head -20
          grep -rln "addBinary(" "$D/lib" | head -3
          echo "== store signature + StoreAction"
          grep -n -A8 "Future<StoreImapResult> store(" "$D/lib/src/imap/imap_client.dart" | cut -c1-180
          grep -rn -E "enum StoreAction|StoreAction\.(remove|add|replace)" "$D/lib/src" | cut -c1-180 | head -6
          grep -rn -E "class MessageFlags|static const String flagged|static const String seen" "$D/lib/src" | cut -c1-180 | head -5
          echo "== file_picker"
          grep -rn -E "Future<String\?> saveFile\(|Future<FilePickerResult\?> pickFiles\(" -A12 "$F/lib/src/file_picker.dart" "$F/lib/src/platform_file_picker.dart" 2>/dev/null | cut -c1-180 | head -60
          echo "== ContentInfo fields"
          grep -rn -E "class ContentInfo|fetchId|fileName|contentType" "$D/lib/src/mail/content_info.dart" 2>/dev/null | cut -c1-160 | head -8

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Windows)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms windows

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Als ZIP verpacken
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mailapp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-windows
          path: mailapp-windows.zip
