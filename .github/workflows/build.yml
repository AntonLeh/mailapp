name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Android)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms android

      - name: Internet-Berechtigung und minSdk setzen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET" />|' $MANIFEST
          sed -i -E 's/minSdk(Version)? *(=|) *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: API-Signaturen von enough_mail ausgeben (Diagnose)
        continue-on-error: true
        run: |
          D=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/enough_mail-* | head -1)
          echo "== MessageSequence"
          grep -rn -E "static MessageSequence (fromId|fromMessage|fromRange|fromIds)|bool isUid|class MessageSequence" -A3 "$D/lib/src" | cut -c1-180 | head -40
          echo "== MimeMessage getters"
          grep -rn -E "(int\?|bool|bool\?|List<MailboxFlag>|List<String>|Mailbox\?) +get (uid|isSeen|isFlagged|flags)|int\? uid|get isSeen|get isFlagged|bool get seen|bool get flagged|isFlagged\b.*=>|isSeen\b.*=>" "$D/lib/src" | cut -c1-180 | head -20
          echo "== uidMove full"
          grep -n -A12 "Future<GenericImapResult> uidMove(" "$D/lib/src/imap/imap_client.dart" | cut -c1-180
          echo "== MailClient ctor / MailAccount"
          grep -rn -E "MailClient\(|MailAccount\.fromManualSettings\(|static MailAccount fromManualSettings|Future<void> connect\(|Future<void> deleteMessage|class MailClient " "$D/lib/src/mail/mail_client.dart" "$D/lib/src/mail/mail_account.dart" 2>/dev/null | cut -c1-180 | head -12
          grep -rln "fromManualSettings" "$D/lib/src" | head -3
          echo "== deleteMessages / moveMessages on ImapClient"
          grep -rn -E "Future<[^=]*> +(deleteMessages|moveMessages|markMessagesSeen)\(" -A4 "$D/lib/src" | cut -c1-180 | head -30

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Windows)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms windows

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Als ZIP verpacken
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mailapp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-windows
          path: mailapp-windows.zip
