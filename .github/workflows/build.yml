name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Android)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms android

      - name: Internet-Berechtigung und minSdk setzen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET" />|' $MANIFEST
          sed -i -E 's/minSdk(Version)? *(=|) *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: API-Signaturen von enough_mail ausgeben (Diagnose)
        continue-on-error: true
        run: |
          D=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/enough_mail-* | head -1)
          echo "== MessageSequence factories"
          grep -n -E "^\s+(static )?MessageSequence[.a-zA-Z]*\(" "$D/lib/src/imap/message_sequence.dart" | cut -c1-160
          echo "== fetchRecentMessages body"
          grep -n -A22 "Future<FetchImapResult> fetchRecentMessages(" "$D/lib/src/imap/imap_client.dart" | cut -c1-180
          echo "== fetchMessages body head"
          grep -n -A14 "Future<FetchImapResult> fetchMessages(" "$D/lib/src/imap/imap_client.dart" | cut -c1-180
          echo "== UID in fetch command"
          grep -n -E "'UID|\"UID|UID FLAGS|\(UID " "$D/lib/src/imap/imap_client.dart" | cut -c1-180 | head -12
          echo "== store body (markSeen path)"
          grep -n -A10 "Future<StoreImapResult> markSeen(" "$D/lib/src/imap/imap_client.dart" | cut -c1-180
          echo "== Mailbox name/path/isInbox"
          grep -n -E "final String (name|path)|String get (name|path)|bool get isInbox|String encodedName|late final String" "$D/lib/src/imap/mailbox.dart" | cut -c1-160 | head -8

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Windows)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms windows

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Als ZIP verpacken
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mailapp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-windows
          path: mailapp-windows.zip
