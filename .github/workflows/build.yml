name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Android)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms android

      - name: Internet-Berechtigung und minSdk setzen
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $MANIFEST || \
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET" />|' $MANIFEST
          sed -i -E 's/minSdk(Version)? *(=|) *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: API-Signaturen von enough_mail ausgeben (Diagnose)
        continue-on-error: true
        run: |
          D=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/enough_mail-* | head -1)
          echo "== $D"
          for f in listMailboxes selectMailboxByPath selectMailbox markSeen markUnseen markFlagged store uidStore uidMove moveMessage deleteMessage moveMessages markMessagesSeen uidStoreMessages copyMessage fetchMessage; do
            grep -n -A4 -E "Future<[^=]*> +$f\(" "$D/lib/src/imap/imap_client.dart" | cut -c1-200
          done
          echo "== mail_client high level"
          grep -n -E "Future<[^=]*> +(markRead|markUnread|deleteMessage|moveMessage|markFlagged|listMailboxes|flagMessage|unflagMessage)\(" -A4 "$D/lib/src/mail/mail_client.dart" | cut -c1-200 | head -60
          echo "== Mailbox / flags"
          grep -rn -E "class Mailbox |isJunk|isTrash|isDrafts|isSent|flags|MailboxFlag\.(junk|trash|drafts|sent)|isSpam|Junk" "$D/lib/src/imap/mailbox.dart" "$D/lib/src/mail/mailbox.dart" 2>/dev/null | cut -c1-200 | head -30
          echo "== MimeMessage flags/seen"
          grep -rn -E "isSeen|isFlagged|hasFlag|setFlag|isUnseen|flags" "$D/lib/src/mail/mime_message.dart" | cut -c1-200 | head -20

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Plattform-Dateien erzeugen (Windows)
        run: flutter create . --project-name mailapp --org de.anton.mail --platforms windows

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Als ZIP verpacken
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mailapp-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mailapp-windows
          path: mailapp-windows.zip
