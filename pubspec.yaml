name: mailapp
description: Mail-Client für Freenet und IONOS mit integriertem PDF-Reader.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  enough_mail: ^2.1.6
  pdfx: ^2.11.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  ios: false
  macos: false
  linux: false
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: false
