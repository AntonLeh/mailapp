name: mailapp
description: Mail-Client für Freenet und IONOS mit integriertem PDF-Reader.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  enough_mail: ^2.1.6
  pdfx: ^2.11.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
